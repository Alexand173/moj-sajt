name: Enrich Concert Videos

on:
  schedule:
    # Run after the daily concert sync and keep URLs no older than one year.
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      max_artists:
        description: "Maximum unique artists to process; leave empty for the default"
        required: false
        type: string
        default: ""

concurrency:
  group: enrich-concert-videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      CONCERT_VIDEO_MAX_ARTISTS: ${{ inputs.max_artists || '75' }}
      CONCERT_VIDEO_SUMMARY_PATH: .tmp/concert-video-enrichment/summary.json

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration
        run: |
          set -euo pipefail
          required=(SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY YOUTUBE_API_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Find and persist fresh official videos
        run: |
          mkdir -p "$(dirname "$CONCERT_VIDEO_SUMMARY_PATH")"
          npm run tickets:enrich-videos

      - name: Upload enrichment summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concert-video-enrichment-${{ github.run_id }}
          path: .tmp/concert-video-enrichment/summary.json
          if-no-files-found: warn
          retention-days: 14
