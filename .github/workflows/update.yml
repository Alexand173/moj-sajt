name: News Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      enrichment_only:
        description: "Skip fetch/scrape and only run the AI enrichment worker"
        type: boolean
        required: false
        default: false

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_NEWS_BATCH_SIZE: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate news update configuration
        run: |
          node - <<'NODE'
          const required = [
            'SUPABASE_URL',
            'SUPABASE_SERVICE_ROLE_KEY',
            'NEWS_API_KEY',
            'OPENAI_API_KEY',
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            console.error(`Missing GitHub Actions secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Run LATEST NewsAPI update
        if: ${{ !cancelled() && inputs.enrichment_only != true }}
        run: npx tsx app/api/fetch-news/route.ts

      - name: Run OFFICIAL source scraper
        if: ${{ !cancelled() && inputs.enrichment_only != true }}
        run: npx tsx app/api/scrape-official/route.ts

      - name: Run AI enrichment worker
        if: ${{ !cancelled() }}
        run: npx tsx scripts/enrich-news.ts
