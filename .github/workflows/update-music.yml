name: Weekly AI Music Chart Update

on:
  schedule:
    # GitHub Actions schedules are UTC: Sunday at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      presets:
        description: "Optional comma-separated presets; leave empty to run all 24 country charts"
        required: false
        type: string
        default: ""

concurrency:
  group: weekly-ai-music-chart-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-music-charts:
    # Hosted Chromium uses an encrypted Soundcharts storage state; no local PC is required.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      AI_SCRAPER_BROWSER_MODE: hosted
      AI_SCRAPER_BROWSER_STORAGE_STATE: ${{ runner.temp }}/soundcharts-storage-state.json
      AI_SCRAPER_PRESETS: ${{ inputs.presets }}
      AI_SCRAPER_MAX_ROWS: 50
      AI_SCRAPER_WAIT_SECONDS: 15
      AI_SCRAPER_ATTEMPTS: 2
      AI_SCRAPER_OUTPUT_ROOT: ${{ runner.temp }}/musictop-ai-scraper/${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate hosted runner secrets
        shell: bash
        env:
          SOUNDCHARTS_STORAGE_STATE_B64: ${{ secrets.SOUNDCHARTS_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          required=(OPENAI_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY YOUTUBE_API_KEY SOUNDCHARTS_STORAGE_STATE_B64)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Validate runner Python
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version

      - name: Install AI scraper dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-ai-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Restore Soundcharts browser session
        shell: bash
        env:
          SOUNDCHARTS_STORAGE_STATE_B64: ${{ secrets.SOUNDCHARTS_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SOUNDCHARTS_STORAGE_STATE_B64" | base64 --decode > "$AI_SCRAPER_BROWSER_STORAGE_STATE"
          python - "$AI_SCRAPER_BROWSER_STORAGE_STATE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(payload, dict):
              raise SystemExit('SOUNDCHARTS_STORAGE_STATE_B64 must contain a JSON object')
          print('Soundcharts browser session restored to runner temp storage.')
          PY

      - name: Validate hosted browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -c "import playwright; print('Playwright:', playwright.__file__)"

      - name: Run OpenAI Vision chart updater
        run: python scripts/run-ai-chart-updates.py

      - name: Upload chart run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-music-chart-update-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/musictop-ai-scraper/${{ github.run_id }}/run-summary.json
            ${{ runner.temp }}/musictop-ai-scraper/${{ github.run_id }}/**/chart-data.json
            ${{ runner.temp }}/musictop-ai-scraper/${{ github.run_id }}/**/run.log
          if-no-files-found: warn
          retention-days: 14
