name: Weekly AI Music Chart Update

on:
  schedule:
    # GitHub Actions schedules are UTC: Sunday at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      presets:
        description: "Optional comma-separated presets; leave empty to run all 24 country charts"
        required: false
        type: string
        default: ""

concurrency:
  group: weekly-ai-music-chart-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-music-charts:
    # This must be an unlocked Windows session with Chrome already authenticated to Soundcharts.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      AI_SCRAPER_PRESETS: ${{ inputs.presets }}
      AI_SCRAPER_MAX_ROWS: 50
      AI_SCRAPER_WAIT_SECONDS: 15
      AI_SCRAPER_ATTEMPTS: 2
      AI_SCRAPER_OUTPUT_ROOT: ${{ github.workspace }}\.tmp\musictop-ai-scraper\${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate runner and secrets
        shell: pwsh
        run: |
          $required = @(
            'OPENAI_API_KEY',
            'SUPABASE_URL',
            'SUPABASE_SERVICE_ROLE_KEY',
            'YOUTUBE_API_KEY'
          )
          $missing = @()
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secrets: $($missing -join ', ')"
          }

          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "$env:LocalAppData\Google\Chrome\Application\chrome.exe"
          )
          if (-not ($chromeCandidates | Where-Object { Test-Path $_ })) {
            throw 'Chrome was not found on the self-hosted runner.'
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI scraper dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r scripts/requirements-ai-scraper.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate interactive desktop
        run: python -c "import mss, pyautogui; print('Desktop:', pyautogui.size()); print('MSS ready:', bool(mss))"

      - name: Run OpenAI Vision chart updater
        run: python scripts/run-ai-chart-updates.py

      - name: Upload chart run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-music-chart-update-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/.tmp/musictop-ai-scraper/${{ github.run_id }}/run-summary.json
            ${{ github.workspace }}/.tmp/musictop-ai-scraper/${{ github.run_id }}/**/chart-data.json
            ${{ github.workspace }}/.tmp/musictop-ai-scraper/${{ github.run_id }}/**/run.log
          if-no-files-found: warn
          retention-days: 14
